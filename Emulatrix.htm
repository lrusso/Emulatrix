      .question{width:200px;text-align:center;cursor:default;font-size:18px;color:#fff;text-shadow:0 0 3px #000000,0 0 7px #000000}
      .contact{margin-right:10px;font-size:18px;color:#fff;text-shadow:0 0 3px #000000,0 0 7px #000000;text-decoration:none;color:#fff;outline:0}
      .contact:focus{outline:1px solid #fff}

      .desktop{display:none;position:fixed;width:350px;left:0;right:0;top:37px;margin:0 auto;z-index:99;background-color:black;border:1px solid #4b4b4b;border-radius:10px;color:#fff;line-height:1.65;padding:10px;font-size:18px;text-align:center}
      .mobile{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;text-align:center;width:380px;height:165px;margin:auto auto;color:#fff;font-family:Arial;font-size:20px;cursor:default;line-height:2;padding-left:20px;padding-right:20px;padding-top:15px;padding-bottom:15px;border-radius:10px;background-color:rgba(0,0,0,0.6)}

      svg{display:inline-block;margin-bottom:10px}

      .controls{display:none;position:fixed;left:0;right:0;top:50px;bottom:0;grid-template-columns:auto auto auto;place-content:center;text-align:center;color:#fff;font-size:18px;line-height:1.65}
      .controls_row{padding-top:50px}
      .controls_title{display:block;height:60px;margin:0 auto 10px auto;padding:0 25px}

      .label_dos{margin-top:10px}
      .label_mobile_controls{position:fixed;right:10px;bottom:10px;color:#fff;text-shadow:0 0 3px #000000,0 0 7px #000000;display:none}

      .upload{position:fixed;left:0;right:0;bottom:10px;background-color:transparent;border:0;padding:0;margin:0;outline:0;width:64px;height:64px;margin:0 auto;cursor:pointer;display:block;filter:drop-shadow(2px 2px 2px #000)}
      .upload:hover{filter:drop-shadow(2px 2px 2px #000) brightness(110%)}
      .upload:focus{outline:1px solid #fff}

      input{display:none}

      .pleasewait{position:fixed;width:64px;height:64px;left:0;right:0;top:0;bottom:0;margin:auto auto;border:0}
      .lds-spinner{color:#fff;display:inline-block;position:relative;width:64px;height:64px}
      .lds-spinner div{transform-origin:32px 32px;animation:lds-spinner 1.2s linear infinite}

      function alertCustom(title, message, accept) {
        var backgroundEmail = document.querySelector(".contact")
        var backgroundUpload = document.querySelector(".upload")
        var backgroundElements = [backgroundEmail, backgroundUpload]
        var backgroundTabIndexes = []

        for (var i = 0; i < backgroundElements.length; i++) {
          if (backgroundElements[i]) {
            backgroundTabIndexes[i] = backgroundElements[i].getAttribute("tabindex")
            backgroundElements[i].setAttribute("tabindex", "-1")
          }
        }

        function onAlertKeyDown(event) {
          if (event.code === "Enter" || event.code === "Space") {
            event.preventDefault()
            closeAlert()
          }
        }

        function closeAlert() {
          document.removeEventListener("keydown", onAlertKeyDown)
          document.body.removeChild(alertContainer)
          restoreBackgroundElements()
          document.addEventListener("keydown", onFirstTabKeyDown)
        }

        // removing the alert leaves the focus on the body, and from there the
        // browser resumes the tab order in document order, where the email
        // comes before the upload button, so the first tab is redirected
        function onFirstTabKeyDown(event) {
          document.removeEventListener("keydown", onFirstTabKeyDown)
          if (event.code === "Tab" && !event.shiftKey && backgroundUpload) {
            event.preventDefault()
            backgroundUpload.focus()
          }
        }

        function restoreBackgroundElements() {
          for (var i = 0; i < backgroundElements.length; i++) {
            if (backgroundElements[i]) {
              if (backgroundTabIndexes[i] === null) {
                backgroundElements[i].removeAttribute("tabindex")
              } else {
                backgroundElements[i].setAttribute(
                  "tabindex",
                  backgroundTabIndexes[i]
                )
              }
            }
          }
        }

        var alertContainer = document.createElement("div")
        alertContainer.setAttribute("tabindex", "-1")
        alertContainer.style.position = "fixed"
        alertContainer.style.top = 0
        alertContainer.style.bottom = 0
        alertContainer.style.left = 0
        alertContainer.style.right = 0
        alertContainer.style.zIndex = 9999
        alertContainer.style.backgroundColor = "rgba(0,0,0,0.5)"

        var alertForm = document.createElement("div")
        alertForm.style.position = "relative"
        alertForm.style.top = "50%"
        alertForm.style.left = 0
        alertForm.style.right = 0
        alertForm.style.marginLeft = "auto"
        alertForm.style.marginRight = "auto"
        alertForm.style.transform = "translateY(-50%)"
        alertForm.style.width = "400px"
        alertForm.style.backgroundColor = "#fff"
        alertForm.style.textAlign = "center"
        alertForm.style.borderRadius = "5px"
        alertForm.style.overflow = "hidden"

        var alertTitle = document.createElement("div")
        alertTitle.style.textAlign = "left"
        alertTitle.style.paddingLeft = "10px"
        alertTitle.style.backgroundColor = "#b9180b"
        alertTitle.style.fontFamily = "Arial"
        alertTitle.style.fontSize = "16px"
        alertTitle.style.fontWeight = "bold"
        alertTitle.style.color = "#fff"
        alertTitle.style.lineHeight = 2.5
        alertTitle.style.textShadow = "0 0 3px #000000,0 0 7px #000000"
        alertTitle.innerText = title

        var alertMessage = document.createElement("div")
        alertMessage.style.padding = "20px"
        alertMessage.style.fontFamily = "Arial"
        alertMessage.style.fontSize = "16px"
        alertMessage.style.color = "black"
        alertMessage.style.textAlign = "center"
        alertMessage.style.lineHeight = 2
        alertMessage.innerText = message

        var alertButton = document.createElement("div")
        alertButton.style.padding = "10px"
        alertButton.style.backgroundColor = "#dadada"
        alertButton.style.border = "1px solid #b2b2b2"
        alertButton.style.fontFamily = "Arial"
        alertButton.style.fontSize = "16px"
        alertButton.style.color = "black"
        alertButton.style.textAlign = "center"
        alertButton.style.lineHeight = 1.5
        alertButton.style.display = "inline-block"
        alertButton.style.marginBottom = "10px"
        alertButton.style.paddingLeft = "40px"
        alertButton.style.paddingRight = "40px"
        alertButton.style.cursor = "pointer"
        alertButton.addEventListener("click", function () {
          closeAlert()
        })
        alertButton.addEventListener("mouseover", function () {
          alertButton.style.backgroundColor = "silver"
        })
        alertButton.addEventListener("mouseout", function () {
          alertButton.style.backgroundColor = "#dadada"
        })
        alertButton.style.borderRadius = "5px"
        alertButton.style.overflow = "hidden"
        alertButton.innerText = accept

        alertForm.appendChild(alertTitle)
        alertForm.appendChild(alertMessage)
        alertForm.appendChild(alertButton)

        alertContainer.appendChild(alertForm)

        document.body.appendChild(alertContainer)

        document.addEventListener("keydown", onAlertKeyDown)

        alertContainer.focus()
      }

      function getBooleanSetting(settingName) {
        try {
          var name = "emulatrix" + settingName
          var nameEQ = name + "="
          var ca = document.cookie.split(";")
          for (var i = 0; i < ca.length; i++) {
            var c = ca[i]
            while (c.charAt(0) == " ") {
              c = c.substring(1, c.length)
            }
            if (c.indexOf(nameEQ) == 0) {
              if (c.substring(nameEQ.length, c.length) == "true") {
                return true
              } else {
                return false
              }
            }
          }
        } catch (err) {
          //
        }

        return true
      }

      function setBooleanSetting(settingName, settingValue) {
        try {
          var name = "emulatrix" + settingName
          var value = String(settingValue)
          var days = 999
          var expires = ""
          if (days) {
            var date = new Date()
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000)
            expires = "; expires=" + date.toUTCString() + "; SameSite=Lax"
          }
          document.cookie = name + "=" + (value || "") + expires + "; Secure; path=/"
        } catch (err) {
          //
        }
      }

      function isMobileDevice() {
        if (!detectPlaform) {
          return false
        }

        return !!(
          navigator.userAgent.match(/Android/i) ||
          navigator.userAgent.match(/iPhone/i) ||
          navigator.userAgent.match(/iPad/i) ||
          navigator.userAgent.match(/iPod/i)
        )
      }

      function isSoundEnabled() {
        return getBooleanSetting("GAME_SOUND_ENABLED")
      }

      function togglePlatformDetection() {
        detectPlaform = !detectPlaform

        setBooleanSetting("DETECT_PLATFORM", detectPlaform)

        if (detectPlaform) {
          labelMobileControls.style.display = "none"
        } else {
          labelMobileControls.style.display = "block"
        }
      }

      function loadCore(
        coreFile,
        callbackCore,
        callbackDownload,
        callbackUpload,
        callbackSound,
        callbackFullscreen,
        callbackReset
      ) {
        containerGame.style.display = "block"

        var scriptLoader = document.createElement("script")
        scriptLoader.addEventListener("load", function () {
          callbackCore()

          document.addEventListener("keydown", function (event) {
            var KEY_CTRL = event.ctrlKey || event.metaKey
            var KEY_0 = event.code === "Digit0"
            var KEY_1 = event.code === "Digit1"
            var KEY_2 = event.code === "Digit2"
            var KEY_3 = event.code === "Digit3"
            var KEY_F = event.code === "KeyF"
            var KEY_R = event.code === "KeyR"

            if (KEY_CTRL && KEY_0) {
              event.preventDefault()
              window.location.reload()
            }

            if (KEY_CTRL && KEY_1) {
              event.preventDefault()
              if (callbackDownload) {
                window[callbackDownload]()
              }
            }

            if (KEY_CTRL && KEY_2) {
              event.preventDefault()
              if (callbackUpload) {
                window[callbackUpload]()
              }
            }

            if (KEY_CTRL && KEY_3) {
              event.preventDefault()
              if (callbackSound) {
                window[callbackSound]()
                setBooleanSetting(
                  "GAME_SOUND_ENABLED",
                  !getBooleanSetting("GAME_SOUND_ENABLED")
                )
              }
            }

            if (KEY_CTRL && KEY_F) {
              event.preventDefault()
              if (callbackFullscreen) {
                window[callbackFullscreen]()
              }
            }

            if (KEY_CTRL && KEY_R) {
              event.preventDefault()
              if (callbackReset) {
                window[callbackReset]()
              }
            }
          })
        })
        scriptLoader.src = coreFile

        document.getElementsByTagName("head")[0].appendChild(scriptLoader)
      }

                  },

                  "uploadStateGameBoyAdvance",
                  "toggleSoundGameBoyAdvance",
                  "requestEmulatorFullscreenGameBoyAdvance",
                  "resetGameBoyAdvance"
                )
              } else if (
                extension === "32x" ||
                extension === "bin" ||
                extension === "smd" ||
                extension === "md"
              ) {
                loadCore(
                  "Emulatrix_Genesis.js",
                  function () {
                    embedGenesis({
                      container: "game",
                      name: file.name,
                      rom: filereader.result,
                      soundEnabled: isSoundEnabled(),
                      showMobileControls: isMobileDevice(),
                      backText: t("back_text"),
                      soundText: t("sound_text"),
                      loadText: t("load_text"),
                      saveText: t("save_text"),
                      player1: {
                        up: "ArrowUp",
                        down: "ArrowDown",
                        left: "ArrowLeft",
                        right: "ArrowRight",
                        start: "Enter",
                        mode: "KeyZ",
                        a: "KeyA",
                        b: "KeyS",
                        c: "KeyD",
                        x: "KeyQ",
                        y: "KeyW",
                        z: "KeyE",
                      },
                      cbStarted: function cbStarted() {
                        pleaseWait.style.display = "none"
                      },
                    })
                  },
                  "downloadStateGenesis",
                  "uploadStateGenesis",
                  "toggleSoundGenesis",
                  "requestEmulatorFullscreenGenesis",
                  "resetGenesis"
                )
              } else if (MAME_ROMS.indexOf("|" + file.name + "|") > -1) {
                loadCore(
                  "Emulatrix_MAME.js",
                  function () {
                    embedMAME({
                      container: "game",
                      name: file.name,
                      rom: filereader.result,
                      soundEnabled: isSoundEnabled(),
                      showMobileControls: isMobileDevice(),
                      backText: t("back_text"),
                      soundText: t("sound_text"),
                      loadText: t("load_text"),
                      saveText: t("save_text"),
                      coin: "Digit1",
                      player1: {
                        up: "ArrowUp",
                        down: "ArrowDown",
                        left: "ArrowLeft",
                        right: "ArrowRight",
                        start: "Enter",
                        button1: "KeyA",
                        button2: "KeyS",
                        button3: "KeyD",
                        button4: "KeyQ",
                        button5: "KeyW",
                        button6: "KeyE",
                      },
                      cbStarted: function cbStarted() {
                        pleaseWait.style.display = "none"
                      },
                    })
                  },
                  "downloadStateMAME",
                  "uploadStateMAME",
                  "toggleSoundMAME",
                  "requestEmulatorFullscreenMAME",
                  "resetMAME"
                )
              } else {
                loadCore(
                  "Emulatrix_DOS.js",
                  function () {
                    embedDOS({
                      container: "game",
                      name: file.name,
                      zipFile: filereader.result,
                      soundEnabled: isSoundEnabled(),
                      showMobileControls: isMobileDevice(),
                      backText: t("back_text"),
                      soundText: t("sound_text"),
                      saveText: t("save_text"),
                      cbStarted: function cbStarted() {
                        console.log("Emulator started.")
                      },
                    })
                  },
                  "downloadDiskDOS",
                  null,
                  "toggleSoundDOS",
                  "requestEmulatorFullscreenDOS",
                  null
                )
              }
            }

            filereader.readAsArrayBuffer(file)
          } else {
            inputUpload.value = null
            alertCustom(t("error_title"), t("error_message"), t("error_ok"))
          }
        } catch (err) {
          //
        }
      }

      window.addEventListener("load", function () {
        // checking if the app is loaded properly
        var secSameDomain = false
        var secNotIframe = window.top === window.self
        var secLocalFile = window.self.location.protocol === "file:"
        try {
          secSameDomain =
            window.top !== window.self &&
            window.top.location.hostname === window.self.location.hostname
        } catch (err) {
          //
        }
        if (secNotIframe || secSameDomain || secLocalFile) {
          pleaseWait = document.querySelector(".pleasewait")
          containerMenu = document.querySelector(".container")
          containerControls = document.querySelector(".controls")
          containerGame = document.getElementById("game")
          labelHowToQuestion = document.querySelector(".question")
          labelHowToDesktop = document.querySelector(".desktop")
          labelHowToMobile = document.querySelector(".mobile")
          labelEmail = document.querySelector(".contact")
          labelMAME = document.querySelector(".label_mame")
          labelDOS = document.querySelector(".label_dos")
          labelMobileControls = document.querySelector(".label_mobile_controls")
          buttonUpload = document.querySelector(".upload")
          inputUpload = document.getElementsByTagName("input")[0]

          pleaseWait.style.display = "none"
          containerMenu.style.display = "block"

          labelHowToQuestion.innerText = t("how_to_question")
          labelHowToDesktop.innerText = t("desktop")
          labelHowToMobile.innerText = t("how_to_mobile")
          labelMAME.innerText = t("insert_coin")
          labelDOS.innerText = t("keyboard_and_mouse")
          labelMobileControls.innerText = t("mobile_controls_hidden")

          labelEmail.href = atob("bWFpbHRvOmluZm9AZW11bGF0cml4LmNvbQ==")
          labelEmail.innerText = atob("aW5mb0BlbXVsYXRyaXguY29t")

          detectPlaform = getBooleanSetting("DETECT_PLATFORM")

          if (detectPlaform) {
            labelMobileControls.style.display = "none"
          } else {
            labelMobileControls.style.display = "block"
          }

          if (isMobileDevice()) {
            labelHowToQuestion.style.display = "none"
            containerControls.style.display = "none"
            labelHowToMobile.style.display = "block"
          } else {
            containerControls.style.display = "grid"
            labelHowToQuestion.style.display = "block"
            labelHowToQuestion.addEventListener("mouseover", function () {
              labelHowToDesktop.style.display = "block"
            })
            labelHowToQuestion.addEventListener("mouseout", function () {
              labelHowToDesktop.style.display = "none"
            })
          }

          buttonUpload.addEventListener("click", function () {
            inputUpload.click()
            buttonUpload.blur()
          })

          inputUpload.addEventListener("change", function (event) {
            runEmulator(event.target.files[0])
          })

          document.addEventListener("keyup", function (event) {
            if (event.code === "KeyC") {
              if (containerMenu.style.display !== "none") {
                togglePlatformDetection()
              }
            }
          })
        }
      })
    </script>
  </body>
</html>
